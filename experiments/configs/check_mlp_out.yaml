# Check (about 30 min): two runs with the adapter on the MLP output (App. B.3) redone and compared with
# the paper's files. Judge: the paper's verdicts for identical answers (no API call).
#   FACTDEPTH_REFERENCE=<reference results> python -m factdepth.run experiments/configs/check_mlp_out.yaml
name: check_mlp_out
models: [google/gemma-3-12b-it]
units: [zh_P19, ru_P937]
facts:
  zh_P19: [P19_zhuang_fenghui]
  ru_P937: [P937_ryapukhin_yelisey]
langs: [ZH]
sizes: ["5"]
steps: [32, 64, 128, 256]
lr: 2.0e-5
site: mlp_out
judge: reuse
reference: paper:mlp_out
out: results/checks/check_mlp_out
